<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GEN X SOFT CLUB — FROSTED</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--con:#140b22;--ice:#ece0ff;--jade:#a07bff;--acid:#ff3ea5}
body{background:#0b0710;color:var(--ice);overflow-x:hidden;
 font:400 14px/1.6 "Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.mono{font-family:ui-monospace,Menlo,monospace;letter-spacing:.16em}

header{position:fixed;z-index:40;top:0;left:0;right:0;display:flex;justify-content:space-between;
 align-items:center;padding:16px 26px;font-size:11px;letter-spacing:.34em;
 background:#0b0710b3;backdrop-filter:blur(16px);border-bottom:1px solid #ffffff14}
header nav a{color:#a892c4;text-decoration:none;margin-left:20px;font-size:10px}
header nav a:hover{color:var(--acid)}

/* ————— the frosted stage ————— */
.stage{position:relative;min-height:100svh;overflow:hidden;cursor:none;
 background:radial-gradient(70% 50% at 50% 40%,#241338,#0a0610)}
.layer{position:absolute;inset:0;display:grid;
 grid-template-columns:repeat(4,1fr);grid-auto-rows:1fr;gap:10px;padding:96px 26px 96px}
.layer.frost{filter:blur(24px) saturate(.55) brightness(.62);
 -webkit-mask-image:var(--m);mask-image:var(--m)}
.tile{position:relative;overflow:hidden;border:1px solid #ffffff1a}
.tile .g{position:absolute;inset:-30%;filter:blur(30px);
 background:radial-gradient(circle at 42% 38%,var(--a),transparent 62%),
            radial-gradient(circle at 68% 74%,var(--b),transparent 60%),var(--c)}
.tile .txt{position:absolute;inset:0;padding:16px;display:flex;flex-direction:column;
 justify-content:space-between}
.tile .txt b{font-size:clamp(13px,1.5vw,19px);font-weight:500;letter-spacing:-.01em;max-width:9ch;
 line-height:1.1;color:#fff;text-shadow:0 2px 14px #0009}
.tile .txt .r{display:flex;justify-content:space-between;font-size:9px;letter-spacing:.22em;color:#12081f;
 background:#ece0ff;padding:4px 7px}
.tile .no{position:absolute;top:14px;right:14px;font-size:9px;letter-spacing:.24em;color:#12081fcc}

.lens{position:fixed;z-index:30;width:240px;height:240px;border-radius:50%;pointer-events:none;
 border:1px solid #ece0ffbf;transform:translate(-50%,-50%) scale(1);
 box-shadow:0 0 0 1px #0b071066,0 20px 60px #000a,0 0 50px #7b3ff24d;transition:transform .22s cubic-bezier(.2,.8,.2,1)}
.lens:after{content:"";position:absolute;inset:-1px;border-radius:50%;
 background:linear-gradient(160deg,#ffffff1a,transparent 34%)}
.lens.big{transform:translate(-50%,-50%) scale(1.55)}
.hint{position:absolute;z-index:20;left:26px;bottom:26px;font-size:10px;letter-spacing:.3em;color:#9a86b8}
.mast{position:absolute;z-index:20;left:26px;top:96px;pointer-events:none}
.mast h1{font-size:clamp(34px,6.6vw,88px);font-weight:200;line-height:.95;letter-spacing:-.03em;
 text-shadow:0 6px 40px #000c}
.mast h1 b{font-weight:700;color:var(--acid)}

section{padding:90px clamp(22px,5vw,64px)}
h2{font-size:10px;letter-spacing:.42em;color:var(--jade);margin-bottom:22px}
.lede{font-size:clamp(19px,2.4vw,30px);font-weight:300;max-width:32ch;line-height:1.25;color:#d8c9f0}
.list{margin-top:50px;border-top:1px solid #ffffff1a}
.list a{display:grid;grid-template-columns:50px 1fr auto auto;gap:20px;align-items:center;
 padding:20px 4px;border-bottom:1px solid #ffffff14;color:inherit;text-decoration:none;transition:.2s}
.list a:hover{background:#1c1030;padding-left:18px}
.list a i{font-style:normal;font-size:10px;color:#8a72ab}
.list a b{font-weight:400;font-size:17px}
.list a em{font-style:normal;font-size:10px;letter-spacing:.22em;color:#8a72ab}
.list a u{text-decoration:none;color:var(--acid);font-size:12px}
footer{border-top:1px solid #ffffff14;padding:26px clamp(22px,5vw,64px) 60px;display:flex;
 justify-content:space-between;flex-wrap:wrap;gap:14px;font-size:10px;letter-spacing:.24em;color:#8a72ab}
@media(max-width:820px){.layer{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.lens{display:none}.stage{cursor:default}.layer.frost{-webkit-mask-image:none;mask-image:none}}
</style>
</head>
<body>

<header>
  <span>GEN X SOFT CLUB</span>
  <nav><a href="#idx">LOOKBOOK</a><a href="#idx">SHOP</a><a href="#idx">CLUB</a><a href="#idx">BAG (0)</a></nav>
</header>

<div class="stage" id="stage">
  <div class="layer sharp" id="sharp"></div>
  <div class="layer frost" id="frost"></div>
  <div class="mast"><h1>EVERYTHING'S<br><b>BEHIND GLASS.</b></h1></div>
  <div class="hint mono">MOVE THE LENS — CLICK TO WIDEN IT</div>
</div>
<div class="lens" id="lens"></div>

<section id="idx">
  <p class="lede">Twelve pieces you can only read up close. That's the whole idea.</p>
  <h2>INDEX / 12</h2>
  <div class="list" id="list"></div>
</section>

<footer class="mono">
  <span>© GEN X SOFT CLUB</span><span>LOOK CLOSER, PAY LATER</span><span>SS26</span>
</footer>

<script>
const P=[
['SOFT SHELL ANORAK','OUTER','¥42,000','#7b3ff2','#ff3ea5','#1a0b33'],
['HALF-ZIP FLEECE','MID','¥31,000','#ff3ea5','#ffb0dd','#3a0a29'],
['MESH LAYER TEE','BASE','¥12,500','#a07bff','#ff6ec7','#241046'],
['CARGO PANT — HAZE','LOWER','¥28,000','#3b2bff','#a07bff','#0f0a3d'],
['PACKABLE DUFFEL','CARRY','¥34,000','#ff6ec7','#7b3ff2','#33093a'],
['NYLON SCARF','ACC','¥11,200','#a07bff','#3b2bff','#1b0f40'],
['TERMINAL CAP','ACC','¥9,800','#ff3ea5','#3b2bff','#2a1147'],
['CREW SOCK ×3','ACC','¥4,400','#ff3ea5','#7b3ff2','#2e0a2a'],
['ARCHIVE PARKA','OUTER','¥58,000','#5a2fd0','#ece0ff','#150a2e'],
['LINER VEST','MID','¥26,000','#7b3ff2','#ff3ea5','#1f0b3a'],
['TRACK SHORT','LOWER','¥17,500','#7b3ff2','#3b2bff','#120a35'],
['SHOULDER POUCH','CARRY','¥15,000','#ffb0dd','#a07bff','#3a1b45']];

const sharp=document.getElementById('sharp'),frost=document.getElementById('frost');
const tile=([n,c,p,a,b,bg],i)=>`<div class="tile"><div class="g" style="--a:${a};--b:${b};--c:${bg}"></div>
 <span class="no mono">${String(i+1).padStart(2,'0')}</span>
 <div class="txt"><b>${n}</b><div class="r mono"><span>${c}</span><span>${p}</span></div></div></div>`;
sharp.innerHTML=P.map(tile).join('');
frost.innerHTML=sharp.innerHTML;

/* lens: a hole punched in the frosted layer's mask */
const lens=document.getElementById('lens'),stage=document.getElementById('stage');
let R=120,tR=120,lx=innerWidth/2,ly=innerHeight*.45,cx=lx,cy=ly;
function setMask(){
  const r=stage.getBoundingClientRect();
  frost.style.setProperty('--m',
   `radial-gradient(circle ${R}px at ${cx-r.left}px ${cy-r.top}px,transparent 0 96%,#000 100%)`);
}
addEventListener('pointermove',e=>{lx=e.clientX;ly=e.clientY});
stage.addEventListener('pointerdown',()=>{tR=190;lens.classList.add('big')});
addEventListener('pointerup',()=>{tR=120;lens.classList.remove('big')});
(function loop(){
  cx+=(lx-cx)*.16; cy+=(ly-cy)*.16; R+=(tR-R)*.12;
  lens.style.left=cx+'px';lens.style.top=cy+'px';
  setMask();
  requestAnimationFrame(loop);
})();
setMask();

document.getElementById('list').innerHTML=P.map(([n,c,p],i)=>
 `<a href="#"><i>${String(i+1).padStart(2,'0')}</i><b>${n}</b><em>${c}</em><u>${p}</u></a>`).join('');
</script>
</body>
</html>
